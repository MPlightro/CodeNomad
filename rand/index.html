<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Coinflip Simulation</title>
    <link rel="stylesheet" href="styles.css"> <!-- Main styles -->
    <link rel="stylesheet" href="navbar.css"> <!-- Navbar styles -->
    <link rel="icon" href="https://content.mycutegraphics.com/graphics/stpat/single-gold-coin.png" type="image/png">
</head>
<body>
<header>
    <div id="navbar"></div> <!-- Placeholder for the navigation bar -->
</header>

<div class="container">
    <h1>Random Coinflip Simulation</h1>
    <input type="number" id="tests" placeholder="Number of Tests" required>
    <button id="run">Run Tests</button>

    <div class="result" id="result"></div>
    <img id="loading" src="https://media2.giphy.com/media/MOsuJf3qp3b1fQx2Iv/giphy.gif?cid=6c09b952c0fa2xjowko8yndnz46r94mtxa0aji35az8ozadz&ep=v1_internal_gif_by_id&rid=giphy.gif&ct=s" alt="Loading..." style="display: none; width: 100px; margin-top: 20px;">
    
    <!-- Loading bar -->
    <div id="loading-bar-container" style="display: none;">
        <div id="loading-bar"></div>
    </div>
    <div id="progress-text" style="color: white; margin-top: 5px;"></div> <!-- Progress text element -->
</div>

<script src="script.js"></script>
<script src="../navbar/nav.js"></script> <!-- Include the navigation script -->
</body>
</html>
