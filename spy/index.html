<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Imposter Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="main">
    <h2>Imposter Game</h2>

    <div id="joinGame">
      <input id="username" placeholder="Your name" />
      <input id="roomCode" placeholder="Room code" />
      <button id="joinBtn">Join Game</button>
      <button id="createBtn">Create Game</button>
    </div>

    <div id="gameArea" style="display:none;">
      <h3 id="playerTitle"></h3>
      <p id="hint"></p>
      <p id="wordDisplay"></p>
      <ul id="playersList"></ul>
      <div id="revealBox" style="margin-top:15px; color:#ff5757; font-weight:bold;"></div>

      <div id="hostControls" style="display:none; margin-top:20px;">
        <button id="startGameBtn">Start Game</button>
        <button id="nextRoundBtn">Next Round</button>
        <button id="revealImposterBtn">Reveal Imposter</button>
        <button id="endGameBtn">End Game</button>
      </div>
    </div>

  </div>
  <script type="module" src="./script.js"></script>
</body>
</html>
